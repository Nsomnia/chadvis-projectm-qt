# ===========================================================================
# release.yml -- tag-triggered build, test, package, publish.
#
# THE ARTIFACTS ARE UNSIGNED. SAY IT OUT LOUD, EVERY TIME.
#   This project has no code-signing identity, no notarisation, and no
#   Developer ID certificate. Nothing here attempts either: passing
#   CODE_SIGN_IDENTITY="" and CODE_SIGNING_ALLOWED=OFF makes that explicit to
#   CMake rather than leaving it to chance, and the release notes lead with the
#   consequence.
#
#   The consequence, stated plainly so it is not discovered by a user: on any
#   machine other than the one that built it, macOS Gatekeeper will refuse to
#   open the .app. The user must right-click > Open once, or run
#       xattr -dr com.apple.quarantine ChadVis.app
#   That is a worse first-run experience than a notarised build, and it is the
#   honest current state rather than something CI should paper over. The .tar.gz
#   has no equivalent problem.
#
# THE macOS ARTIFACT DEPENDS ON A CHANGE OUTSIDE THIS ONE.
#   CMake's DragNDrop generator packages a MACOSX_BUNDLE. If the
#   `chadvis-projectm-qt` target in cmake/TargetSetup.cmake does not carry
#   `MACOSX_BUNDLE TRUE`, cpack on macOS produces a directory of loose dylibs
#   rather than an .app -- a .dmg that cannot be launched.
#
#   That property is a separate, concurrent change to cmake/TargetSetup.cmake,
#   which is outside this change's write scope. So this workflow DETECTS the
#   shape rather than assuming it, and macOS is marked `required: false` in the
#   matrix:
#
#     bundle present -> package it. Works the moment the property lands, with no
#                       edit here.
#     bundle absent  -> the macOS leg fails at "Verify the macOS bundle exists",
#                       naming the exact property to set. Because that leg is
#                       non-required the failure does not block the release:
#                       the Linux .tar.gz still ships, and the generated release
#                       notes say in plain words that no macOS artifact is
#                       attached.
#
#   The alternative -- publishing the loose-dylib .dmg and calling it macOS --
#   is the failure mode this exists to prevent. The notes are generated from the
#   files that were actually uploaded, so the release can never overstate what
#   it contains.
#
#   The detection globs `*.app` rather than the target's own name on purpose:
#   MACOSX_BUNDLE_BUNDLE_NAME is what decides the bundle's name, so the bundle
#   is not required to be named after the target, and a check that hardcoded one
#   of the two would be wrong the moment the other changed.
#
# WHY ctest RUNS AT ALL HERE
#   A tag is a claim that the tree is shippable. Running the headless gate
#   before packaging is what keeps that claim honest, and it is nearly free
#   because the build has already happened.
#
# WHY ONLY THE HEADLESS GATE BLOCKS A RELEASE
#   Same reasoning as build.yml: three entries need a drawable and one needs a
#   real audio device, and a tag should not be blocked by a runner that has
#   neither. They are run and their outcome recorded.
# ===========================================================================

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  package:
    name: package (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            id: linux-tgz
            generator: TGZ
            # required: true means a Linux failure blocks the release. That is
            # the leg that must always succeed.
            required: true
          - os: macos-14
            id: macos-dmg
            generator: DragNDrop
            # required: false means the macOS leg reports red without blocking,
            # which is what the missing MACOSX_BUNDLE property needs today.
            required: false
    # A failure in a non-required leg still shows as failed on the check, so
    # the signal is visible; it just does not stop the release.
    continue-on-error: ${{ !matrix.required }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A tag that disagrees with version.txt publishes a mislabelled artifact.
      # version.txt is the single source of truth (the root CMakeLists
      # validates it into PROJECT_VERSION), so the check is version.txt against
      # the tag rather than two copies of the version.
      - name: Verify the tag matches version.txt
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have="$(tr -d '[:space:]' < version.txt)"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says ${want} but version.txt says ${have}."
            echo "::error::Fix the version or the tag. Publishing a mislabelled artifact is worse than not publishing."
            exit 1
          fi
          echo "Tag and version.txt agree: $have"

      # See build.yml for the full package -> cmake/Dependencies.cmake probe map.
      # ccache IS kept here (unlike tsan.yml): no sanitizer here, and it is
      # auto-detected by Compiler.cmake. No cache step is wired up in this
      # workflow, so it will simply miss on a cold runner.
      #
      # NO COMMENTS INSIDE THE COMMAND -- a `#` line inside a backslash
      # continuation ends the logical line, and bash only fails at RUN time,
      # not under `bash -n`.
      - name: Install Linux system dependencies (apt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            pkg-config \
            ccache \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libtag1-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libglm-dev \
            libdbus-1-3 \
            libxkbcommon0 \
            libxcb-cursor0

      - name: Install Qt 6.8.3 (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          install-deps: true
          cache: true
          cache-key-prefix: qt-linux-6.8.3

      - name: Install macOS system dependencies (Homebrew)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew update
          # qt is keg-only, so it needs an explicit CMAKE_PREFIX_PATH at
          # configure time; ffmpeg and taglib are keg-only pkg-config
          # consumers and need PKG_CONFIG_PATH. spdlog/fmt/tomlplusplus/glm are
          # neither -- their CMake config packages land in /usr/local and are
          # already on CMake's search path, which is the system branch of
          # cmake/Dependencies.cmake that this job exists to exercise.
          brew install cmake ninja ccache qt spdlog fmt tomlplusplus taglib ffmpeg glm
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig:$(brew --prefix taglib)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          set -euo pipefail
          args=(
            -G Ninja -S . -B build-release
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
            # CHADVIS_NATIVE_ARCH is deliberately left at its OFF default. A
            # -march=native Release is not redistributable, and this is the
            # build a release is cut from.
          )
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=(-DCMAKE_PREFIX_PATH="$(brew --prefix qt)")
            # Explicitly unsigned. See the header of this file.
            args+=(
              -DCMAKE_OSX_CODE_SIGN_IDENTITY=""
              -DCMAKE_OSX_CODE_SIGNING_REQUIRED=NO
              -DCMAKE_OSX_CODE_SIGNING_ALLOWED=NO
            )
          else
            args+=(-DCMAKE_PREFIX_PATH="$QT_ROOT_DIR")
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build-release --parallel

      - name: Assert ctest discovered the expected entries
        run: |
          set -u
          DIR="build-release/tests"
          # AGENTS.md §3: `ctest --test-dir build` discovers ZERO tests and
          # still exits 0. A release cut from a tree that tested nothing is the
          # worst possible place for that to happen.
          if [ ! -f "$DIR/CTestTestfile.cmake" ]; then
            echo "::error title=zero tests discovered::$DIR has no CTestTestfile.cmake."
            exit 1
          fi
          LIST="$(ctest --test-dir "$DIR" -N)"
          printf '%s\n' "$LIST"
          TOTAL="$(printf '%s\n' "$LIST" | sed -n 's/^Total Tests: *//p')"
          if [ "${TOTAL:-0}" -lt 10 ]; then
            echo "::error::ctest reported ${TOTAL:-0} tests; a release must not be cut from a tree that tests nothing."
            exit 1
          fi
          for t in unit_tests test_HttpPolicy test_CapturedHosts test_FeatureFlags \
                   test_RenderExecutor test_SunoAudioUploadService test_SunoRequestEpoch \
                   test_SunoExploreService test_SunoNotificationService test_ClerkAuthClient; do
            printf '%s\n' "$LIST" | grep -Eq "^ *Test +#[0-9]+: ${t}\$" || {
              echo "::error::ctest entry '$t' is built but ctest did not discover it"
              exit 1
            }
          done

      - name: Run the headless gate (10 entries)
        run: |
          ctest --test-dir build-release/tests --output-on-failure \
            -R '^(unit_tests|test_HttpPolicy|test_CapturedHosts|test_FeatureFlags|test_RenderExecutor|test_SunoAudioUploadService|test_SunoRequestEpoch|test_SunoExploreService|test_SunoNotificationService|test_ClerkAuthClient)$'

      - name: Run the runtime-environment entries (reported, non-gating)
        continue-on-error: true
        run: |
          set -u
          RE='^(integration_tests|integration_gl_tests|test_OffscreenRenderSpike)$'
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" \
              env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
              ctest --test-dir build-release/tests --output-on-failure -R "$RE"
          else
            ctest --test-dir build-release/tests --output-on-failure -R "$RE"
          fi

      # ---------------------------------------------------------------------
      # The macOS bundle check. Placed AFTER the tests on purpose: if the
      # bundle is missing the leg fails, and the test results above are still
      # in the log, so the job reports everything it learned before dying.
      #
      # THIS IS THE STEP THAT DEPENDS ON THE CONCURRENT cmake/TargetSetup.cmake
      # CHANGE. See the header of this file.
      # ---------------------------------------------------------------------
      - name: Verify the macOS bundle exists (MACOSX_BUNDLE dependency)
        if: runner.os == 'macOS'
        run: |
          set -uo pipefail
          # Glob `*.app`, not `chadvis-projectm-qt*.app`: MACOSX_BUNDLE_BUNDLE_NAME
          # decides the bundle's name, so it need not match the target.
          if compgen -G "build-release/*.app" > /dev/null; then
            echo "MACOSX_BUNDLE is set -- found:"
            ls -d build-release/*.app
            exit 0
          fi
          echo "::error title=macOS bundle missing::CMake's DragNDrop generator packages a MACOSX_BUNDLE, and the chadvis-projectm-qt target in cmake/TargetSetup.cmake does not set MACOSX_BUNDLE."
          echo "::error::Without it this job would publish a .dmg of loose dylibs that cannot be launched. The macOS leg is marked required:false, so the Linux .tar.gz still releases and these notes will say no macOS artifact is attached."
          echo "::error::Fix: set_target_properties(chadvis-projectm-qt PROPERTIES MACOSX_BUNDLE TRUE) in cmake/TargetSetup.cmake, then re-run this workflow. No change here is needed."
          exit 1

      - name: Package with cpack
        run: |
          set -euo pipefail
          cd build-release
          cpack -G "${{ matrix.generator }}"
          # Deliberately not `mapfile`: GitHub's macOS runners run
          # /bin/bash, which is 3.2 and has no mapfile. A `set -u` expansion of
          # an empty bash-4 array is itself an unbound-variable error, so the
          # count is taken from `wc -l` instead.
          #
          # Fail here rather than at upload-artifact, which reports "no files
          # found" as a packaging failure with none of this context.
          find . -maxdepth 1 \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \) |
            sort > "$RUNNER_TEMP/cpack-output.txt"
          cat "$RUNNER_TEMP/cpack-output.txt"
          count="$(wc -l < "$RUNNER_TEMP/cpack-output.txt" | tr -d ' ')"
          if [ "$count" -lt 1 ]; then
            echo "::error::cpack produced no archive with generator ${{ matrix.generator }}."
            exit 1
          fi
          echo "cpack produced $count archive(s)."

      - name: Warn about code signing
        run: |
          {
            echo "### Signing"
            echo
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              echo "**The .app is UNSIGNED and NOT notarised.** macOS Gatekeeper will"
              echo "block it on any machine but the one that built it. To open it:"
              echo
              echo '```'
              echo "right-click > Open                            # once, then trusted"
              echo "xattr -dr com.apple.quarantine ChadVis.app   # or this"
              echo '```'
            else
              echo "Linux \`.tar.gz\`, unsigned in the usual sense (no package-signing key)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: chadvis-${{ matrix.id }}
          # Only regular archives. The loose .app in build-release/ is
          # deliberately NOT uploaded: the .dmg is the deliverable, a bundle
          # drags out of it in one gesture, and uploading a directory tree
          # re-opens questions about symlinks and mode bits inside it for no
          # gain. The two platform-specific patterns where only one matches are
          # fine -- if-no-files-found fires only when NONE match.
          path: |
            build-release/*.tar.gz
            build-release/*.zip
            build-release/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish release
    needs: [package]
    # Runs even when a non-required leg (macOS) failed, so a missing macOS
    # bundle does not also cost the Linux artifact. `!cancelled()` still means
    # a cancelled or timed-out workflow publishes nothing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      # Needed for `gh release create`. Scoped to this job only; the build jobs
      # above run with contents: read.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: chadvis-*
          merge-multiple: true

      # The Linux leg is the one that must always succeed. Checking for its
      # artifact here rather than trusting the needs graph is deliberate: with
      # a matrix, `needs.package.result` is an aggregate and cannot say which
      # leg failed.
      - name: Refuse to publish without the Linux artifact
        run: |
          set -euo pipefail
          if ! compgen -G "dist/*.tar.gz" > /dev/null; then
            echo "::error title=refusing to publish::The required Linux .tar.gz is absent from dist/. A tag with no shippable artifact is worse than no tag."
            ls -la dist/ 2>/dev/null || true
            exit 1
          fi
          echo "Linux artifact present."

      # Deliberately before the notes step: this is the "what am I about to ship"
      # view in the log, and it must show whatever actually arrived rather
      # than the list the notes then describe.
      - name: List what is actually being published
        run: ls -lh dist/

      - name: Write release notes
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"

          # Regular files only. dist/ is expected to hold archives; the filter
          # is here because `gh release upload` rejects anything that is not a
          # regular file, and an opaque "not a regular file" from gh is a bad
          # way to learn that a .dmg path expanded to a directory.
          assets=()
          for f in dist/*; do
            if [ -f "$f" ]; then assets+=("$f"); fi
          done
          echo "Release assets: ${assets[*]}"
          printf '%s\n' "${assets[@]}" > "$RUNNER_TEMP/assets.txt"

          {
            echo "ChadVis ${version} — ${GITHUB_REF_NAME}"
            echo
            echo "---"
            echo
            echo "## ⚠️ READ THIS BEFORE INSTALLING ON macOS"
            echo
            echo "**These builds are not code-signed and not notarised.** The project"
            echo "carries no Developer ID certificate, so macOS Gatekeeper will refuse to"
            echo "open the \`.app\` on any machine other than the one that built it. Once:"
            echo
            echo "- right-click the app and choose **Open**, or"
            echo "- run \`xattr -dr com.apple.quarantine ChadVis.app\`"
            echo
            echo "---"
            echo
            echo "## Artifacts in this release"
            echo
            echo "Generated from the files actually uploaded, so this list cannot"
            echo "overstate what shipped:"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in "${assets[@]}"; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo

            if compgen -G "dist/*.app" > /dev/null || compgen -G "dist/*.dmg" > /dev/null; then
              echo "The macOS build is \`ChadVis.app\`; open the \`.dmg\` and drag it to"
              echo "/Applications. It is unsigned, so expect the Gatekeeper prompt above."
            else
              echo "### No macOS artifact in this release"
              echo
              echo "The macOS packaging leg did not complete. This is expected while the"
              echo "\`chadvis-projectm-qt\` target in \`cmake/TargetSetup.cmake\` does not carry"
              echo "\`MACOSX_BUNDLE TRUE\`: CMake's DragNDrop generator packages a bundle, so"
              echo "without that property the output would be a directory of loose dylibs"
              echo "that cannot be launched. Rather than ship that, the leg stops and says"
              echo "so. Linux users are unaffected."
            fi

            echo
            echo "## What was verified before packaging"
            echo
            echo "On every platform that produced an artifact: a full CMake configure and"
            echo "build, then the 10 headless ctest entries (\`unit_tests\` plus 9 standalone"
            echo "suites). Three further entries — \`integration_tests\`,"
            echo "\`integration_gl_tests\`, \`test_OffscreenRenderSpike\` — need a real"
            echo "drawable, and \`integration_tests\` also constructs a real \`AudioEngine\`,"
            echo "so they are run and reported but not allowed to block a release."
            echo
            echo "Built from commit \`${GITHUB_SHA}\`."
          } > release-notes.md

          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < "$RUNNER_TEMP/assets.txt"
          [ "${#assets[@]}" -ge 1 ] || { echo "::error::no release assets"; exit 1; }
          # --clobber makes a re-run idempotent instead of failing on "release
          # already exists", which is the difference between a workflow someone
          # can re-run after a flaky runner and one that needs a new tag every
          # time.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — uploading over it."
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --verify-tag
          fi
          echo "Published: $(gh release view "$TAG" --json url --jq .url)"