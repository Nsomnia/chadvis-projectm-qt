# ===========================================================================
# release.yml -- tag-triggered build, test, package, publish.
#
# THE macOS ARTIFACT IS AD-HOC SIGNED, NEVER NOTARISED. SAY IT OUT LOUD, EVERY TIME.
#   This project has no Developer ID certificate, so there is no notarisation and
#   no Gatekeeper pass on any other machine.
#
#   Precise wording, because the distinction decides what a user must do
#   (T0039): the bundle IS signed, by cmake/TargetSetup.cmake:868, which runs
#   `codesign --force --deep --sign "-"` as a POST_BUILD step. Ad-hoc signing
#   binds the bytes to the bundle but identifies no developer, so it satisfies
#   neither Gatekeeper nor notarisation. Saying "unsigned" was wrong twice
#   over -- the notes were false, and "unsigned" invites the reader to expect
#   no signature at all.
#
#   The CMAKE_OSX_CODE_SIGNING_* flags below therefore do NOT control the final
#   signature: they govern CMake's own link-time signing, while the POST_BUILD
#   codesign above is unconditional and independent of them. They are still
#   passed, to keep the two from fighting.
#
#   The consequence, stated plainly so it is not discovered by a user: on any
#   machine other than the one that built it, macOS Gatekeeper will refuse to
#   open the .app. The user must right-click > Open once, or run
#       xattr -dr com.apple.quarantine ChadVis.app
#   That is a worse first-run experience than a notarised build, and it is the
#   honest current state rather than something CI should paper over. The .tar.gz
#   has no equivalent problem.
#
# THE macOS ARTIFACT DEPENDS ON A CHANGE OUTSIDE THIS ONE.
#   CMake's DragNDrop generator packages a MACOSX_BUNDLE. If the
#   `chadvis-projectm-qt` target in cmake/TargetSetup.cmake does not carry
#   `MACOSX_BUNDLE TRUE`, cpack on macOS produces a directory of loose dylibs
#   rather than an .app -- a .dmg that cannot be launched.
#
#   That premise is now OBSOLETE (T0039). The property landed: cmake/TargetSetup.cmake:263
#   sets MACOSX_BUNDLE TRUE. This header used to describe the property as a
#   pending change "outside this change's write scope" and to mark macOS
#   `required: false` in the matrix so a missing bundle could not block a
#   release. With the property present, that exemption only means a broken
#   macOS packaging step ships silently while the badge stays green -- the leg
#   fails, nobody reads it, and the release notes quietly carry no macOS
#   artifact.
#
#   So macOS is now a REQUIRED matrix leg. The detection step below is kept
#   anyway -- it still names the exact property to set if the bundle ever goes
#   missing -- but it is now a guard that stops a release instead of a warning
#   that gets filed away:
#
#     bundle present -> package it. The expected path.
#     bundle absent  -> the macOS leg fails at "Verify the macOS bundle exists",
#                       naming the exact property to set. Required, so it stops
#                       the release instead of shipping a Linux-only one that
#                       nobody notices until a user reports the missing download.
#
#   The alternative -- publishing the loose-dylib .dmg and calling it macOS --
#   is the failure mode this exists to prevent. The notes are generated from the
#   files that were actually uploaded, so the release can never overstate what
#   it contains.
#
#   The detection globs `*.app` rather than the target's own name on purpose:
#   MACOSX_BUNDLE_BUNDLE_NAME is what decides the bundle's name, so the bundle
#   is not required to be named after the target, and a check that hardcoded one
#   of the two would be wrong the moment the other changed.
#
# WHY ctest RUNS AT ALL HERE
#   A tag is a claim that the tree is shippable. Running the headless gate
#   before packaging is what keeps that claim honest, and it is nearly free
#   because the build has already happened.
#
# WHY ONLY THE HEADLESS GATE BLOCKS A RELEASE
#   Same reasoning as build.yml: three entries need a drawable and one needs a
#   real audio device, and a tag should not be blocked by a runner that has
#   neither. They are run and their outcome recorded.
# ===========================================================================

name: release

# HOW A BUILD IS SHIPPED BY AN AGENT (workflow_dispatch)
#   `./scripts/release.sh` is the one command. It refuses to run unless the
#   pushed HEAD is green on both gates, then dispatches this workflow with an
#   explicit `tag` and the verified `ref`; the tag is created here, pointing at
#   the commit that was actually built and tested. Nothing is tagged locally,
#   which is why the dispatch path cannot publish a different commit than the
#   one the gate passed.
#
#   The tag carries the whole policy:
#     v1.2.0                 -> a release, marked latest
#     v1.2.0-build.<sha>     -> a pre-release, never latest
#   A hyphen after the version is the only signal, so `--prerelease` is
#   derived from it rather than from an input somebody can forget.
#
#   Dispatch is not a CI backdoor: the same build, the same 11 headless
#   entries, the same packaging. It exists because `GITHUB_TOKEN` cannot
#   trigger a tag-push workflow, so a workflow that tagged and hoped for a
#   second run would silently publish nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.2.0-build.abc1234 (v<version>[-<prerelease>])'
        required: true
        type: string
      ref:
        description: 'Commit SHA to tag (leave empty for the dispatched ref tip)'
        required: false
        type: string

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  # `github.event.inputs` is empty on push, so this is the tag either way.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # What the release is built from and where a new tag points. A dispatch can
  # name a SHA; a tag push is that tag's commit.
  TARGET_REF: ${{ github.event.inputs.ref || github.sha }}

jobs:
  package:
    name: package (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            id: linux-tgz
            generator: TGZ
            # required: true means a Linux failure blocks the release. That is
            # the leg that must always succeed.
            required: true
          - os: macos-15
            id: macos-dmg
            generator: DragNDrop
            # required: true (T0039). This used to be false, on the premise that
            # MACOSX_BUNDLE was not yet set. It is set -- TargetSetup.cmake:263 --
            # so a red macOS leg now means packaging is genuinely broken, and
            # shipping anyway is how a release ends up with no .dmg that nobody
            # notices until a user reports it.
            required: true
    # A failure in a non-required leg still shows as failed on the check, so
    # the signal is visible; it just does not stop the release.
    continue-on-error: ${{ !matrix.required }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      # The tag carries a base version plus an optional `-<prerelease>`. Only
      # the base is compared: `v1.2.0` and `v1.2.0-build.abc1234` are both
      # built from version.txt 1.2.0, and testing the whole tag against it
      # would refuse every pre-release.
      - name: Resolve the tag and check it against version.txt
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::'$TAG' is not a version tag. Expected v1.2.3 or v1.2.3-something."
              exit 1
              ;;
          esac
          base="${TAG#v}"
          base="${base%%-*}"
          have="$(tr -d '[:space:]' < version.txt)"
          if [ "$base" != "$have" ]; then
            echo "::error::Tag $TAG says version ${base} but version.txt says ${have}."
            echo "::error::Fix the version or the tag. Publishing a mislabelled artifact is worse than not publishing."
            exit 1
          fi
          echo "Tag $TAG is version.txt $have"
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # See build.yml for the full package -> cmake/Dependencies.cmake probe map.
      # ccache IS kept here (unlike tsan.yml): no sanitizer here, and it is
      # auto-detected by Compiler.cmake. No cache step is wired up in this
      # workflow, so it will simply miss on a cold runner.
      #
      # NO COMMENTS INSIDE THE COMMAND -- a `#` line inside a backslash
      # continuation ends the logical line, and bash only fails at RUN time,
      # not under `bash -n`.
      - name: Install Linux system dependencies (apt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            pkg-config \
            ccache \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libtag1-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libglm-dev \
            libdbus-1-3 \
            libxkbcommon0 \
            libxcb-cursor0

      - name: Install Qt 6.8.3 (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          # cmake/Dependencies.cmake:13 requires Qt6::Multimedia; the module is
          # not part of the base install.
          modules: 'qtmultimedia'
          install-deps: true
          cache: true
          cache-key-prefix: qt-linux-6.8.3

      - name: Install macOS system dependencies (Homebrew)
        if: runner.os == 'macOS'
        env:
          # Same rule as build.yml: use the formulae the runner image already
          # bottled for its own macOS. `brew update` pulls versions Homebrew no
          # longer bottles for this release, and every one then builds from
          # source (measured at 1h23m on macos-14).
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          set -euo pipefail
          # qt is keg-only, so it needs an explicit CMAKE_PREFIX_PATH at
          # configure time; ffmpeg and taglib are keg-only pkg-config
          # consumers and need PKG_CONFIG_PATH. spdlog/fmt/tomlplusplus/glm are
          # neither -- their CMake config packages land in /usr/local and are
          # already on CMake's search path, which is the system branch of
          # cmake/Dependencies.cmake that this job exists to exercise.
          # projectm is deliberately NOT installed: Homebrew's formula is
          # 3.1.12, and cmake/FindProjectM4.cmake wants v4, so CPM builds the
          # source copy exactly as it does for every other lane.
          brew install cmake ninja ccache qt spdlog fmt tomlplusplus taglib \
            ffmpeg glm
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig:$(brew --prefix taglib)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          set -euo pipefail
          args=(
            -G Ninja -S . -B build-release
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
            # CHADVIS_NATIVE_ARCH is deliberately left at its OFF default. A
            # -march=native Release is not redistributable, and this is the
            # build a release is cut from.
          )
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=(-DCMAKE_PREFIX_PATH="$(brew --prefix qt)")
            # Explicitly unsigned. See the header of this file.
            args+=(
              -DCMAKE_OSX_CODE_SIGN_IDENTITY=""
              -DCMAKE_OSX_CODE_SIGNING_REQUIRED=NO
              -DCMAKE_OSX_CODE_SIGNING_ALLOWED=NO
            )
          else
            args+=(-DCMAKE_PREFIX_PATH="$QT_ROOT_DIR")
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build-release --parallel

      - name: Assert ctest discovered the expected entries
        run: |
          set -u
          DIR="build-release/tests"
          # AGENTS.md §3: `ctest --test-dir build` discovers ZERO tests and
          # still exits 0. A release cut from a tree that tested nothing is the
          # worst possible place for that to happen.
          if [ ! -f "$DIR/CTestTestfile.cmake" ]; then
            echo "::error title=zero tests discovered::$DIR has no CTestTestfile.cmake."
            exit 1
          fi
          LIST="$(ctest --test-dir "$DIR" -N)"
          printf '%s\n' "$LIST"
          TOTAL="$(printf '%s\n' "$LIST" | sed -n 's/^Total Tests: *//p')"
          if [ "${TOTAL:-0}" -lt 10 ]; then
            echo "::error::ctest reported ${TOTAL:-0} tests; a release must not be cut from a tree that tests nothing."
            exit 1
          fi
          for t in unit_tests test_HttpPolicy test_CapturedHosts test_FeatureFlags \
                   test_RenderExecutor test_ThemeQml test_SunoAudioUploadService test_SunoRequestEpoch \
                   test_SunoExploreService test_SunoNotificationService test_ClerkAuthClient; do
            printf '%s\n' "$LIST" | grep -Eq "^ *Test +#[0-9]+: ${t}\$" || {
              echo "::error::ctest entry '$t' is built but ctest did not discover it"
              exit 1
            }
          done

      - name: Run the headless gate (11 entries)
        run: |
          ctest --test-dir build-release/tests --output-on-failure \
            -R '^(unit_tests|test_HttpPolicy|test_CapturedHosts|test_FeatureFlags|test_RenderExecutor|test_ThemeQml|test_SunoAudioUploadService|test_SunoRequestEpoch|test_SunoExploreService|test_SunoNotificationService|test_ClerkAuthClient)$'

      - name: Run the runtime-environment entries (reported, non-gating)
        continue-on-error: true
        run: |
          set -u
          RE='^(integration_tests|integration_gl_tests|test_OffscreenRenderSpike)$'
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" \
              env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
              ctest --test-dir build-release/tests --output-on-failure -R "$RE"
          else
            ctest --test-dir build-release/tests --output-on-failure -R "$RE"
          fi

      # ---------------------------------------------------------------------
      # The macOS bundle check. Placed AFTER the tests on purpose: if the
      # bundle is missing the leg fails, and the test results above are still
      # in the log, so the job reports everything it learned before dying.
      #
      # THIS IS THE STEP THAT DEPENDS ON THE CONCURRENT cmake/TargetSetup.cmake
      # CHANGE. See the header of this file.
      # ---------------------------------------------------------------------
      - name: Verify the macOS bundle exists (MACOSX_BUNDLE dependency)
        if: runner.os == 'macOS'
        run: |
          set -uo pipefail
          # Glob `*.app`, not `chadvis-projectm-qt*.app`: MACOSX_BUNDLE_BUNDLE_NAME
          # decides the bundle's name, so it need not match the target.
          if compgen -G "build-release/*.app" > /dev/null; then
            echo "MACOSX_BUNDLE is set -- found:"
            ls -d build-release/*.app
            exit 0
          fi
          echo "::error title=macOS bundle missing::CMake's DragNDrop generator packages a MACOSX_BUNDLE, and the chadvis-projectm-qt target in cmake/TargetSetup.cmake does not set MACOSX_BUNDLE."
          echo "::error::Without it this job would publish a .dmg of loose dylibs that cannot be launched. The macOS leg is required, so this stops the release instead of shipping a Linux-only one with no explanation."
          echo "::error::Fix: set_target_properties(chadvis-projectm-qt PROPERTIES MACOSX_BUNDLE TRUE) in cmake/TargetSetup.cmake, then re-run this workflow. No change here is needed."
          exit 1

      - name: Package with cpack
        run: |
          set -euo pipefail
          cd build-release
          cpack -G "${{ matrix.generator }}"
          # Deliberately not `mapfile`: GitHub's macOS runners run
          # /bin/bash, which is 3.2 and has no mapfile. A `set -u` expansion of
          # an empty bash-4 array is itself an unbound-variable error, so the
          # count is taken from `wc -l` instead.
          #
          # Fail here rather than at upload-artifact, which reports "no files
          # found" as a packaging failure with none of this context.
          find . -maxdepth 1 \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \) |
            sort > "$RUNNER_TEMP/cpack-output.txt"
          cat "$RUNNER_TEMP/cpack-output.txt"
          count="$(wc -l < "$RUNNER_TEMP/cpack-output.txt" | tr -d ' ')"
          if [ "$count" -lt 1 ]; then
            echo "::error::cpack produced no archive with generator ${{ matrix.generator }}."
            exit 1
          fi
          echo "cpack produced $count archive(s)."

      - name: Warn about code signing
        run: |
          {
            echo "### Signing"
            echo
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              echo "**The .app is AD-HOC SIGNED and NOT notarised.** It is signed with"
              echo "identity \`-\`, which binds the bytes but identifies no developer, so"
              echo "macOS Gatekeeper will still block it on any machine but the one that"
              echo "built it. To open it:"
              echo
              echo '```'
              echo "right-click > Open                            # once, then trusted"
              echo "xattr -dr com.apple.quarantine ChadVis.app   # or this"
              echo '```'
            else
              echo "Linux \`.tar.gz\`, unsigned in the usual sense (no package-signing key)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: chadvis-${{ matrix.id }}
          # Only regular archives. The loose .app in build-release/ is
          # deliberately NOT uploaded: the .dmg is the deliverable, a bundle
          # drags out of it in one gesture, and uploading a directory tree
          # re-opens questions about symlinks and mode bits inside it for no
          # gain. The two platform-specific patterns where only one matches are
          # fine -- if-no-files-found fires only when NONE match.
          path: |
            build-release/*.tar.gz
            build-release/*.zip
            build-release/*.dmg
          if-no-files-found: error
          retention-days: 30

  # The Windows artifact is built by the Windows gate itself, not by a second
  # copy of its 300 lines: `windows.yml` is a reusable workflow, and calling it
  # here puts its windeployqt zip in this run's artifact store where the
  # publish job can collect it with the same `chadvis-*` pattern.
  #
  # Its failure does NOT block the other platforms: a Windows runner hiccup
  # should not withhold a working Linux and macOS build. `scripts/release.sh`
  # is what makes it load-bearing -- it fails unless all three archives are
  # attached, and a re-dispatch is idempotent.
  windows:
    name: windows package
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: read

  publish:
    name: publish release
    needs: [package, windows]
    # Runs even when the Windows leg failed, so a runner hiccup there does not
    # cost the Linux and macOS artifacts; the step below enforces what a given
    # tag is allowed to ship without. `!cancelled()` still means a cancelled or
    # timed-out workflow publishes nothing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      # Needed for `gh release create`. Scoped to this job only; the build jobs
      # above run with contents: read.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      # GITHUB_ENV does not cross jobs, so the SHA the release points at is
      # resolved here from the tree that was checked out rather than trusted
      # from the dispatch input.
      - name: Resolve the target commit
        run: echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: chadvis-*
          merge-multiple: true

      # The Linux leg is the one that must always succeed. Checking for its
      # artifact here rather than trusting the needs graph is deliberate: with
      # a matrix, `needs.package.result` is an aggregate and cannot say which
      # leg failed.
      #
      # Windows is enforced only on a real release: a per-commit pre-release
      # may ship without it, and `scripts/release.sh` is what refuses to call
      # the job done until all three are attached.
      - name: Refuse to publish without the Linux artifact
        run: |
          set -euo pipefail
          if ! compgen -G "dist/*.tar.gz" > /dev/null; then
            echo "::error title=refusing to publish::The required Linux .tar.gz is absent from dist/. A tag with no shippable artifact is worse than no tag."
            ls -la dist/ 2>/dev/null || true
            exit 1
          fi
          echo "Linux artifact present."
          if ! compgen -G "dist/*windows*.zip" > /dev/null; then
            case "$TAG" in
              v[0-9]*.[0-9]*.[0-9]*-*)
                echo "::warning title=no Windows artifact::This is a pre-release, so it publishes without one. Re-dispatch when the Windows lane is green." ;;
              *)
                echo "::error title=refusing to publish::A release must carry the Windows zip. Re-dispatch once the Windows lane is green; the upload is idempotent."
                exit 1 ;;
            esac
          fi

      # Deliberately before the notes step: this is the "what am I about to ship"
      # view in the log, and it must show whatever actually arrived rather
      # than the list the notes then describe.
      - name: List what is actually being published
        run: ls -lh dist/

      - name: Write release notes
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"

          # Regular files only. dist/ is expected to hold archives; the filter
          # is here because `gh release upload` rejects anything that is not a
          # regular file, and an opaque "not a regular file" from gh is a bad
          # way to learn that a .dmg path expanded to a directory.
          assets=()
          for f in dist/*; do
            if [ -f "$f" ]; then assets+=("$f"); fi
          done
          echo "Release assets: ${assets[*]}"
          printf '%s\n' "${assets[@]}" > "$RUNNER_TEMP/assets.txt"

          # The Unreleased section is the human answer to "what is in this
          # build", and it lives in one owning file. Truncated because a
          # changelog entry is an essay and a release page is a summary; the
          # link at the bottom goes to the rest.
          changelog="$(awk '
            /^## \[Unreleased\]/ { f=1; next }
            /^## \[/ { f=0 }
            f && n < 100 { print; n++ }
          ' CHANGELOG.md)"

          {
            echo "ChadVis ${version} — ${TAG}"
            echo
            echo "---"
            echo
            echo "## ⚠️ READ THIS BEFORE INSTALLING ON macOS"
            echo
            echo "**These builds are not code-signed and not notarised.** The project"
            echo "carries no Developer ID certificate, so macOS Gatekeeper will refuse to"
            echo "open the \`.app\` on any machine other than the one that built it. Once:"
            echo
            echo "- right-click the app and choose **Open**, or"
            echo "- run \`xattr -dr com.apple.quarantine ChadVis.app\`"
            echo
            echo "---"
            echo
            echo "## Artifacts in this release"
            echo
            echo "Generated from the files actually uploaded, so this list cannot"
            echo "overstate what shipped:"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in "${assets[@]}"; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo

            if compgen -G "dist/*.dmg" > /dev/null; then
              echo "The macOS build is \`ChadVis.app\`; open the \`.dmg\` and drag it to"
              echo "/Applications. It is unsigned, so expect the Gatekeeper prompt above."
            else
              echo "### No macOS artifact in this release"
              echo
              echo "The macOS packaging leg did not complete. Its job log names the"
              echo "failing step; a release built without it is a Linux-only release"
              echo "and says so here rather than leaving the .dmg's absence to be"
              echo "discovered from the asset list."
            fi
            echo

            if compgen -G "dist/*windows*.zip" > /dev/null; then
              echo "### Windows"
              echo
              echo "Unzip \`chadvis-windows-x64.zip\` anywhere and run"
              echo "\`chadvis-projectm-qt.exe\`. Qt and the vcpkg runtime DLLs are inside,"
              echo "so nothing has to be installed first."
            else
              echo "### No Windows artifact in this release"
              echo
              echo "The Windows lane did not produce its zip. That leg is reported but"
              echo "does not block the other platforms; re-dispatch the release once it"
              echo "is green and the upload is idempotent."
            fi

            echo
            echo "## What was verified before packaging"
            echo
            echo "On every platform that produced an artifact: a full CMake configure and"
            echo "build, then the 11 headless ctest entries (\`unit_tests\` plus 10 standalone"
            echo "suites). Three further entries — \`integration_tests\`,"
            echo "\`integration_gl_tests\`, \`test_OffscreenRenderSpike\` — need a real"
            echo "drawable, and \`integration_tests\` also constructs a real \`AudioEngine\`,"
            echo "so they are run and reported but not allowed to block a release."
            echo
            echo "Built from commit \`${TARGET_SHA}\`."
            echo
            if [ -n "$changelog" ]; then
              echo "---"
              echo
              echo "## What changed since the last release"
              echo
              echo "$changelog"
              echo
              echo "_The full history is [\`CHANGELOG.md\`](https://github.com/${GITHUB_REPOSITORY}/blob/${TARGET_SHA}/CHANGELOG.md)._"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < "$RUNNER_TEMP/assets.txt"
          [ "${#assets[@]}" -ge 1 ] || { echo "::error::no release assets"; exit 1; }

          # A hyphen after the version is the entire pre-release policy.
          # Without it GitHub marks the release "Latest", and a per-commit
          # build must never do that.
          pre_args=()
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-*) pre_args=(--prerelease) ;;
            *) pre_args=(--latest) ;;
          esac

          # --clobber makes a re-run idempotent instead of failing on "release
          # already exists", which is the difference between a workflow someone
          # can re-run after a flaky runner and one that needs a new tag every
          # time.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — uploading over it."
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" \
              --notes-file release-notes.md "${pre_args[@]}"
          else
            # A tag push has a tag to verify; a dispatch does not, so it names
            # the commit explicitly and lets gh create the tag there.
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              gh release create "$TAG" "${assets[@]}" \
                --title "$TAG" \
                --notes-file release-notes.md \
                --verify-tag \
                "${pre_args[@]}"
            else
              gh release create "$TAG" "${assets[@]}" \
                --title "$TAG" \
                --notes-file release-notes.md \
                --target "$TARGET_SHA" \
                "${pre_args[@]}"
            fi
          fi
          echo "Published: $(gh release view "$TAG" --json url --jq .url)"