# ===========================================================================
# windows.yml -- Windows build signal. Reports; does NOT block a PR.
#
# WHY IT EXISTS AND WHY IT IS NON-BLOCKING
#   Windows 10/11 is the major userbase (AGENTS.md §7) and it is also the
#   platform with the worst current credential story: the TODO records that
#   `CHADVIS_HAS_KEYCHAIN` was only ever defined inside `if(APPLE ...)`, so
#   Windows fell through to the file backend and wrote the Clerk credential —
#   a `token_type: "refresh"` credential with `Max-Age=31536000`, i.e. a
#   ONE-YEAR secret — in the clear. CredentialStoreWin32.cpp now exists, but
#   "the code is written" is not "the code has ever been compiled on the
#   platform it targets", and a lane that has never run is indistinguishable
#   from a lane that would have passed.
#
#   So: `continue-on-error: true` at the job level. A Windows failure is
#   visible on the check, it shows up in the Actions tab, and it does not stop
#   a PR from merging.
#
#   THE TRADE-OFF, STATED PLAINLY: a non-blocking job rots unnoticed. If this
#   workflow is failing on every push and nobody reads it, it has stopped
#   being a signal and become decoration — the same fate as a permanently
#   failing gate, only quieter. Whoever owns this needs to watch it for a few
#   pushes after it first goes green. The honest fix is to get it green and
#   then make it blocking; until then it is a smoke alarm with the battery out.
#
# EXPECT IT TO FAIL ON THE FIRST RUN
#   There is no vcpkg.json in this repository, and creating one is outside the
#   scope of this change, so the native dependencies below are installed by
#   explicit `vcpkg install` lines. vcpkg's ffmpeg port in particular builds
#   most of the world from source on first use -- measured at 32 minutes on the
#   dynamic triplet, because the runner's vcpkg is newer than the published
#   binary feed and every port misses it. The job caches the result (see the
#   restore/save steps) so only the first run pays; it is non-blocking
#   precisely so that a slow or incomplete first run is signal, not breakage.
#
# WHAT IS ACTUALLY WORTH DOING HERE
#   1. Does it CONFIGURE? That is the highest-value question on this platform,
#      because it is the one that has never been asked: the `FileBackend` ->
#      `CredWrite` path, the OpenGL lookup, and the Qt component list have all
#      been written by inference.
#   2. Does it BUILD?
#   3. Do the headless suites LINK and RUN?
#   Not the drawable suites. A GitHub Windows runner has no GPU and no
#   meaningful GL driver, so `integration_gl_tests` would fail for
#   environmental reasons and tell us nothing.
# ===========================================================================

name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_DIR: build-ci
  # Release, and the dynamic `x64-windows` triplet -- learnt from a run that
  # failed: the static triplet is built against the static CRT, so linking our
  # objects against it meant /MT, and /MT is a CRT mismatch against Qt's own
  # /MD binaries, which neither vendor supports. The dynamic triplet matches
  # Qt's runtime and costs only the DLLs the package step copies into the zip.
  CMAKE_BUILD_TYPE: Release
  # MSVC 19.3x+ is Compiler.cmake's floor (>= 19.29). windows-latest ships
  # VS 2022.
  #
  # NOT `VCPKG_ROOT`: ilammy/msvc-dev-cmd@v1 overwrites that variable with
  # Visual Studio's bundled vcpkg, so a later `"$env:VCPKG_ROOT\vcpkg.exe"`
  # resolves to a different tree than the one the job configured against.
  # A private name keeps the two independent.
  CHADVIS_VCPKG_ROOT: C:\vcpkg
  # The published binary feed misses these ports (measured: ffmpeg built from
  # source for 32 minutes), so persist what gets built. `default` keeps the
  # upstream read-only feed for ports it does have.
  VCPKG_BINARY_SOURCES: clear;default,readwrite;files,C:\vcpkg-cache,readwrite

jobs:
  windows:
    name: windows-latest / MSVC (signal only, non-blocking)
    runs-on: windows-latest
    # See the header. Do not remove this without reading it first.
    continue-on-error: true
    # 32 minutes of that is vcpkg building ffmpeg from source on a cold cache.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Restore/save are separate steps on purpose: `actions/cache` only saves
      # when the job succeeds, so a run that failed AFTER paying the ffmpeg
      # build threw the whole cache away (run 39465642575, post step skipped).
      # Save under `always()` and a failing run still pays forward.
      #
      # Keyed on a hand-bumped tag rather than a hash: the cache holds compiled
      # binaries, and busting it on every workflow edit costs half an hour.
      # Bump `v1` when the port list or the triplet changes.
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: C:\vcpkg-cache
          key: vcpkg-dynamic-v1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # No vcpkg.json exists, so the ports are named explicitly. Keeping them
      # in one block means the diff when someone does add a manifest is
      # readable.
      #
      # `glew` is not for us: projectM v4 is built from source by CPM when no
      # system copy is found, and its own CMakeLists.txt:190 calls
      # find_package(GLEW REQUIRED). Without it, configure dies at
      # "Could NOT find GLEW (missing: GLEW_INCLUDE_DIRS GLEW_LIBRARIES)"
      # inside the projectM subproject (run 39398976104, the first Windows run
      # ever to reach Configure with Qt Multimedia present).
      - name: Install native dependencies (vcpkg)
        shell: pwsh
        run: |
          & "$env:CHADVIS_VCPKG_ROOT\vcpkg.exe" install `
            spdlog:x64-windows `
            fmt:x64-windows `
            tomlplusplus:x64-windows `
            glm:x64-windows `
            glew:x64-windows `
            taglib:x64-windows

      # ffmpeg is the long pole and the likeliest single point of failure.
      # It is allowed to miss on its own without taking the Qt install with
      # it: cmake/Dependencies.cmake falls back to a manual
      # find_path/find_library search, so a missing port surfaces as a clear
      # configure-time error rather than as a confusing link failure later.
      # It is split out from the step above so that `continue-on-error` covers
      # only the port that needs it -- the previous shape let a missing `glew`
      # or `taglib` report green here and fail twenty seconds later in
      # configure, which reads like a code problem and is not one.
      - name: Install ffmpeg (vcpkg, allowed to miss)
        shell: pwsh
        continue-on-error: true
        run: |
          & "$env:CHADVIS_VCPKG_ROOT\vcpkg.exe" install ffmpeg:x64-windows

      - name: Report vcpkg's view of the dependency set
        if: always()
        shell: pwsh
        # A LITERAL block, not a double-quoted scalar. In YAML double-quoted
        # strings `\v` is the vertical-tab escape, so
        #   run: "& \"$env:VCPKG_ROOT\vcpkg.exe\" list"
        # reached PowerShell as `...vcpkgcpkg.exe` and failed the job at this
        # step while every build step after it was skipped.
        run: |
          $vcpkg = "$env:CHADVIS_VCPKG_ROOT\vcpkg.exe"
          if (Test-Path $vcpkg) { & $vcpkg list } else { Write-Warning "vcpkg not found at $vcpkg" }

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # Multimedia is an add-on module, not part of the base install, and
          # cmake/Dependencies.cmake:13 requires Qt6::Multimedia. Without it
          # configure fails at "Failed to find required Qt component Multimedia".
          modules: 'qtmultimedia'
          cache: true
          cache-key-prefix: qt-windows-6.8.3

      - name: Configure
        run: |
          cmake -S . -B $env:BUILD_DIR `
            -DCMAKE_BUILD_TYPE=$env:CMAKE_BUILD_TYPE `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$env:CHADVIS_VCPKG_ROOT\installed\x64-windows" `
            -DCMAKE_TOOLCHAIN_FILE="$env:CHADVIS_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build $env:BUILD_DIR --config $env:CMAKE_BUILD_TYPE --parallel

      - name: Assert ctest discovered the expected entries
        shell: pwsh
        run: |
          $dir = "$env:BUILD_DIR/tests"
          if (-not (Test-Path "$dir/CTestTestfile.cmake")) {
            Write-Error "::error title=zero tests discovered::${dir} has no CTestTestfile.cmake; ctest would report 0 tests and exit 0."
            exit 1
          }
          $list = ctest --test-dir $dir -N -C $env:CMAKE_BUILD_TYPE | Out-String
          Write-Host $list
          if ($list -notmatch 'Total Tests:\s*(\d+)') {
            Write-Error "::error::Could not read a test count from ctest -N."
            exit 1
          }
          $total = [int]$Matches[1]
          if ($total -lt 10) {
            Write-Error "::error::ctest reported $total tests; expected at least 10."
            exit 1
          }
          foreach ($t in @('unit_tests','test_HttpPolicy','test_CapturedHosts','test_FeatureFlags',
                          'test_RenderExecutor','test_ThemeQml','test_SunoAudioUploadService','test_SunoRequestEpoch',
                          'test_SunoExploreService','test_SunoNotificationService','test_ClerkAuthClient')) {
            $pattern = "Test\s+#\d+:\s+$([regex]::Escape($t))(\s|$)"
            if ($list -notmatch $pattern) {
              Write-Error "::error::ctest entry '$t' is built but was not discovered."
              exit 1
            }
          }
          Write-Host "All 11 gating entries discovered; ctest reports $total."

      # Same 11 entries build.yml gates on. The three runtime-environment
      # entries are deliberately absent: no GPU, no meaningful GL driver, and
      # AudioEngine with no output device. Nothing here would be signal.
      - name: Run the headless gate (11 entries)
        run: |
          ctest --test-dir $env:BUILD_DIR/tests --output-on-failure -C $env:CMAKE_BUILD_TYPE `
            -R '^(unit_tests|test_HttpPolicy|test_CapturedHosts|test_FeatureFlags|test_RenderExecutor|test_ThemeQml|test_SunoAudioUploadService|test_SunoRequestEpoch|test_SunoExploreService|test_SunoNotificationService|test_ClerkAuthClient)$'

      - name: Report the credential backend this build selected
        # The one question this platform can uniquely answer. `CHADVIS_HAS_KEYCHAIN`
        # is Apple-only and `CHADVIS_HAS_WIN32_CREDENTIALS` is the Windows arm;
        # if neither reaches the compile line, Windows is writing the one-year
        # refresh credential to a plaintext file and no test on any other
        # platform would ever have noticed.
        shell: pwsh
        run: |
          $defs = Get-Content -Recurse -Include '*.vcxproj','flags.make','*.rsp' `
            -Path "$env:BUILD_DIR" -ErrorAction SilentlyContinue |
            Select-String -Pattern 'CHADVIS_HAS_(WIN32_CREDENTIALS|KEYCHAIN|SECRET_SERVICE)' |
            Select-Object -ExpandProperty Line -Unique
          if (-not $defs) {
            Write-Warning "No credential-backend macro found in the build files."
            Write-Warning "Windows may be falling through to the plaintext FileBackend."
          } else {
            $defs | ForEach-Object { Write-Host $_ }
          }

      # ---------------------------------------------------------------------
      # Package a runnable archive.
      #
      # Deliberately not `cpack`: the tree has a full macOS deployment chain
      # (macdeployqt + install_name rewriting, cmake/TargetSetup.cmake) and no
      # Windows equivalent, so CPack's Windows ZIP would carry the .exe and its
      # config but none of the Qt DLLs -- an archive that only runs on a machine
      # that already has this exact Qt. `windeployqt` is the Qt-supplied answer
      # and is already installed by install-qt-action.
      #
      # Qt is not the whole dynamic closure: the vcpkg ports are DLLs too, and
      # windeployqt knows nothing about them. They are copied from the
      # triplet's bin/ below. `--compiler-runtime` stays ON (the default) --
      # these ports and Qt are /MD, so the zip needs the VC redistributable
      # DLLs a machine without Visual Studio may not have.
      # ---------------------------------------------------------------------
      - name: Package (windeployqt + zip)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path "$env:BUILD_DIR" -Filter 'chadvis-projectm-qt.exe' |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "::error::no chadvis-projectm-qt.exe under $env:BUILD_DIR"; exit 1 }
          $stage = Join-Path $env:RUNNER_TEMP 'stage/ChadVis'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName $stage
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release --no-translations `
            --dir $stage (Join-Path $stage $exe.Name)
          if ($LASTEXITCODE -ne 0) { Write-Error "::error::windeployqt failed"; exit 1 }
          Copy-Item "$env:CHADVIS_VCPKG_ROOT\installed\x64-windows\bin\*.dll" $stage
          Get-ChildItem $stage -Filter '*.dll' | Select-Object -ExpandProperty Name
          if (Test-Path 'config') { Copy-Item -Recurse -Force 'config' (Join-Path $stage 'config') }
          $zip = Join-Path $env:BUILD_DIR 'chadvis-windows-x64.zip'
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Get-Item $zip | Format-Table Name, Length

      - name: Upload the packaged build
        uses: actions/upload-artifact@v7
        with:
          name: chadvis-windows-x64-msvc
          path: ${{ env.BUILD_DIR }}/chadvis-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:\vcpkg-cache
          key: vcpkg-dynamic-v1