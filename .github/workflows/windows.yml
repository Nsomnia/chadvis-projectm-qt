# ===========================================================================
# windows.yml -- the Windows gate: build, headless tests, deployable bundle.
#
# Windows 10/11 is the major userbase, so this is a gate, not a smoke alarm.
# It builds Release against the dynamic `x64-windows` triplet (the static one
# is a CRT mismatch against Qt's /MD binaries), runs the same headless entries
# as Linux and macOS, and uploads a `windeployqt` bundle with the vcpkg DLLs
# beside it -- an archive that runs on a machine that has never seen Qt.
#
# Before "simplifying" any step, read T0298 in TODO.md. This lane had never
# built a single target until 2026-10-20, and the seven defects that took it
# from "git checkout fails" to green include three that fail silently or
# misleadingly: the Qt `modules:` list, the private CHADVIS_VCPKG_ROOT, and
# `ffmpeg[x264]` (without x264 the app records nothing, and says so only in a
# log line).
#
# Not covered: the GL suites. A runner has no GPU, so `integration_gl_tests`
# and the offscreen spike would fail for environmental reasons and prove
# nothing.
# ===========================================================================

name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml so a release ships the same Windows bundle this gate
  # proves. No inputs and no secrets: the artifact name is the contract.
  workflow_call:

concurrency:
  # `github.workflow` is the CALLER's name when this is reusable, so a release
  # dispatch and a push gate never cancel each other.
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_DIR: build-ci
  # Release, and the dynamic `x64-windows` triplet -- learnt from a run that
  # failed: the static triplet is built against the static CRT, so linking our
  # objects against it meant /MT, and /MT is a CRT mismatch against Qt's own
  # /MD binaries, which neither vendor supports. The dynamic triplet matches
  # Qt's runtime and costs only the DLLs the package step copies into the zip.
  #
  # The generator is Ninja (named at the Configure step), so this is a real
  # single-config build type. The lane used to omit -G, letting CMake pick
  # Visual Studio 2022, where CMAKE_BUILD_TYPE is inert and the same value had
  # to be repeated as `--config` and `-C` at every build/test call (T0091).
  # MSVC 19.3x+ is Compiler.cmake's floor (>= 19.29). windows-latest ships
  # VS 2022, and msvc-dev-cmd puts its compiler on PATH for Ninja.
  CMAKE_BUILD_TYPE: Release
  #
  # NOT `VCPKG_ROOT`: ilammy/msvc-dev-cmd@v1 overwrites that variable with
  # Visual Studio's bundled vcpkg, so a later `"$env:VCPKG_ROOT\vcpkg.exe"`
  # resolves to a different tree than the one the job configured against.
  # A private name keeps the two independent.
  CHADVIS_VCPKG_ROOT: C:\vcpkg
  # The published binary feed misses these ports (measured: ffmpeg built from
  # source for 32 minutes), so persist what gets built. `default` keeps the
  # upstream read-only feed for ports it does have.
  VCPKG_BINARY_SOURCES: clear;default,readwrite;files,C:\vcpkg-cache,readwrite
  # A dynamic triplet installs a port for debug AND release by default, and
  # ffmpeg's debug half cost another ten minutes per cold build. Nothing here
  # ever links a debug vcpkg library -- this job is Release only.
  VCPKG_BUILD_TYPE: release

jobs:
  windows:
    name: windows-latest / MSVC
    runs-on: windows-latest
    # A cold vcpkg cache means building ffmpeg from source; a warm one runs
    # the whole job in about twelve minutes.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Restore/save are separate steps on purpose: `actions/cache` only saves
      # when the job succeeds, so a run that failed AFTER paying the ffmpeg
      # build threw the whole cache away (run 39465642575, post step skipped).
      # Save under `always()` and a failing run still pays forward.
      #
      # Keyed per run with a prefix restore, so the newest archive always wins
      # and a hand-bumped generation number cannot strand a build. That is not
      # theoretical: `v2` was saved once, `cache-hit` then reported true on
      # every later run, and the x264/ffmpeg packages that a cold run had just
      # spent 30 minutes building were skipped by the save guard -- so the next
      # run rebuilt them, twice.
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: C:\vcpkg-cache
          key: vcpkg-dynamic-${{ github.run_id }}
          restore-keys: vcpkg-dynamic-

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # No vcpkg.json exists, so the ports are named explicitly. Keeping them
      # in one block means the diff when someone does add a manifest is
      # readable.
      #
      # `glew` is not for us: projectM v4 is built from source by CPM when no
      # system copy is found, and its own CMakeLists.txt:190 calls
      # find_package(GLEW REQUIRED). Without it, configure dies at
      # "Could NOT find GLEW (missing: GLEW_INCLUDE_DIRS GLEW_LIBRARIES)"
      # inside the projectM subproject (run 39398976104, the first Windows run
      # ever to reach Configure with Qt Multimedia present).
      # vcpkg does not prune `installed/` when a port is upgraded, and the
      # package step copies every DLL it finds there: the first bundle carried
      # two FFmpeg generations (avformat-61 and avformat-63) and vcpkg's own
      # build-time pkgconf-8.dll. Starting from an empty tree costs a few
      # seconds of extraction from the binary cache and ships only what is
      # linked.
      - name: Clear the vcpkg installed tree
        shell: pwsh
        run: |
          if (Test-Path "$env:CHADVIS_VCPKG_ROOT\installed") {
            Remove-Item -Recurse -Force "$env:CHADVIS_VCPKG_ROOT\installed"
          }

      - name: Install native dependencies (vcpkg)
        shell: pwsh
        run: |
          & "$env:CHADVIS_VCPKG_ROOT\vcpkg.exe" install `
            spdlog:x64-windows `
            fmt:x64-windows `
            tomlplusplus:x64-windows `
            glm:x64-windows `
            glew:x64-windows `
            taglib:x64-windows

      # ffmpeg is the long pole and the likeliest single point of failure, so
      # it gets its own step and its own log. It is NOT allowed to miss: the
      # recording pipeline is the product, and cmake/Dependencies.cmake already
      # fails at configure without it -- letting this step report green only
      # moves the same failure twenty seconds later and makes it read like a
      # code problem.
      #
      # `[x264]` is not optional either. libx264 is the app's default recording
      # codec (ConfigData.hpp `video.codec`), and vcpkg's ffmpeg port does not
      # enable it by default: without it a Windows build starts, plays audio and
      # records nothing, reported as "Video codec not found: libx264". It is the
      # same GPL encoder Homebrew's ffmpeg gives the macOS build.
      - name: Install ffmpeg (vcpkg)
        shell: pwsh
        run: |
          & "$env:CHADVIS_VCPKG_ROOT\vcpkg.exe" install "ffmpeg[x264]:x64-windows"

      - name: Report vcpkg's view of the dependency set
        if: always()
        shell: pwsh
        # A LITERAL block, not a double-quoted scalar. In YAML double-quoted
        # strings `\v` is the vertical-tab escape, so
        #   run: "& \"$env:VCPKG_ROOT\vcpkg.exe\" list"
        # reached PowerShell as `...vcpkgcpkg.exe` and failed the job at this
        # step while every build step after it was skipped.
        run: |
          $vcpkg = "$env:CHADVIS_VCPKG_ROOT\vcpkg.exe"
          if (Test-Path $vcpkg) { & $vcpkg list } else { Write-Warning "vcpkg not found at $vcpkg" }

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # Multimedia is an add-on module, not part of the base install, and
          # cmake/Dependencies.cmake:13 requires Qt6::Multimedia. Without it
          # configure fails at "Failed to find required Qt component Multimedia".
          modules: 'qtmultimedia'
          cache: true
          cache-key-prefix: qt-windows-6.8.3

      - name: Configure
        run: |
          # ${{ env.* }} rather than $env:*: the expression is substituted by
          # the runner before PowerShell parses the line, so a cache value can
          # never end up as the literal text `$env:CMAKE_BUILD_TYPE` (which is
          # exactly what reached rules.ninja once Ninja was selected).
          #
          # C++ module scanning is OFF because this tree has no module sources.
          # MSVC is a scanning compiler, so Ninja otherwise writes CXX_SCAN
          # rules for every target -- pure generator noise and one more thing
          # that can differ from the other two platforms.
          cmake -S . -B "${{ env.BUILD_DIR }}" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE="${{ env.CMAKE_BUILD_TYPE }}" `
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$env:CHADVIS_VCPKG_ROOT\installed\x64-windows" `
            -DCMAKE_TOOLCHAIN_FILE="$env:CHADVIS_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build "${{ env.BUILD_DIR }}" --parallel

      - name: Assert ctest discovered the expected entries
        shell: pwsh
        run: |
          $dir = "$env:BUILD_DIR/tests"
          if (-not (Test-Path "$dir/CTestTestfile.cmake")) {
            Write-Error "::error title=zero tests discovered::${dir} has no CTestTestfile.cmake; ctest would report 0 tests and exit 0."
            exit 1
          }
          $list = ctest --test-dir $dir -N | Out-String
          Write-Host $list
          if ($list -notmatch 'Total Tests:\s*(\d+)') {
            Write-Error "::error::Could not read a test count from ctest -N."
            exit 1
          }
          $total = [int]$Matches[1]
          if ($total -lt 10) {
            Write-Error "::error::ctest reported $total tests; expected at least 10."
            exit 1
          }
          foreach ($t in @('unit_tests','test_HttpPolicy','test_CapturedHosts','test_FeatureFlags',
                          'test_RenderExecutor','test_ThemeQml','test_SunoAudioUploadService','test_SunoRequestEpoch',
                          'test_SunoExploreService','test_SunoNotificationService','test_ClerkAuthClient')) {
            $pattern = "Test\s+#\d+:\s+$([regex]::Escape($t))(\s|$)"
            if ($list -notmatch $pattern) {
              Write-Error "::error::ctest entry '$t' is built but was not discovered."
              exit 1
            }
          }
          Write-Host "All 11 gating entries discovered; ctest reports $total."

      # Same 11 entries build.yml gates on. The three runtime-environment
      # entries are deliberately absent: no GPU, no meaningful GL driver, and
      # AudioEngine with no output device. Nothing here would be signal.
      - name: Run the headless gate (11 entries)
        run: |
          ctest --test-dir $env:BUILD_DIR/tests --output-on-failure `
            --parallel $env:NUMBER_OF_PROCESSORS `
            -R '^(unit_tests|test_HttpPolicy|test_CapturedHosts|test_FeatureFlags|test_RenderExecutor|test_ThemeQml|test_SunoAudioUploadService|test_SunoRequestEpoch|test_SunoExploreService|test_SunoNotificationService|test_ClerkAuthClient)$'

      - name: Report the credential backend this build selected
        # The one question this platform can uniquely answer. `CHADVIS_HAS_KEYCHAIN`
        # is Apple-only and `CHADVIS_HAS_WIN32_CREDENTIALS` is the Windows arm;
        # if neither reaches the compile line, Windows is writing the one-year
        # refresh credential to a plaintext file and no test on any other
        # platform would ever have noticed.
        shell: pwsh
        run: |
          # Get-ChildItem, not Get-Content: `-Recurse` is not a Get-Content
          # parameter, and this step had never run before the tests first went
          # green, so it failed on its first execution with "A parameter cannot
          # be found that matches parameter name 'Recurse'".
          $defs = Get-ChildItem -Path "$env:BUILD_DIR" -Recurse `
            -Include 'build.ninja','*.vcxproj','flags.make','*.rsp' -ErrorAction SilentlyContinue |
            Select-String -Pattern 'CHADVIS_HAS_(WIN32_CREDENTIALS|KEYCHAIN|SECRET_SERVICE)' |
            Select-Object -ExpandProperty Line -Unique
          if (-not $defs) {
            Write-Warning "No credential-backend macro found in the build files."
            Write-Warning "Windows may be falling through to the plaintext FileBackend."
          } else {
            $defs | ForEach-Object { Write-Host $_ }
          }

      # ---------------------------------------------------------------------
      # Package a runnable archive.
      #
      # Deliberately not `cpack`: the tree has a full macOS deployment chain
      # (macdeployqt + install_name rewriting, cmake/TargetSetup.cmake) and no
      # Windows equivalent, so CPack's Windows ZIP would carry the .exe and its
      # config but none of the Qt DLLs -- an archive that only runs on a machine
      # that already has this exact Qt. `windeployqt` is the Qt-supplied answer
      # and is already installed by install-qt-action.
      #
      # Qt is not the whole dynamic closure: the vcpkg ports are DLLs too, and
      # windeployqt knows nothing about them. They are copied from the
      # triplet's bin/ below. `--compiler-runtime` stays ON (the default) --
      # these ports and Qt are /MD, so the zip needs the VC redistributable
      # DLLs a machine without Visual Studio may not have.
      # ---------------------------------------------------------------------
      - name: Package (windeployqt + zip)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path "$env:BUILD_DIR" -Filter 'chadvis-projectm-qt.exe' |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } |
            Select-Object -First 1
          if (-not $exe) { Write-Error "::error::no chadvis-projectm-qt.exe under $env:BUILD_DIR"; exit 1 }
          $stage = Join-Path $env:RUNNER_TEMP 'stage/ChadVis'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName $stage
          # --qmldir is not optional for a Qt Quick app: the QML itself is
          # compiled into the exe, but the IMPORT plugins (QtQuick,
          # QtQuick.Controls, QtMultimedia) live in the Qt tree, and without
          # them the zip starts and shows nothing -- "module QtQuick.Controls is
          # not installed". windeployqt only asks qmlimportscanner when told
          # where the QML is.
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release --no-translations `
            --qmldir src/qml `
            --dir $stage (Join-Path $stage $exe.Name)
          if ($LASTEXITCODE -ne 0) { Write-Error "::error::windeployqt failed"; exit 1 }
          Copy-Item "$env:CHADVIS_VCPKG_ROOT\installed\x64-windows\bin\*.dll" $stage
          Get-ChildItem $stage -Filter '*.dll' | Select-Object -ExpandProperty Name
          if (Test-Path 'config') { Copy-Item -Recurse -Force 'config' (Join-Path $stage 'config') }
          $zip = Join-Path $env:BUILD_DIR 'chadvis-windows-x64.zip'
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Get-Item $zip | Format-Table Name, Length

      - name: Upload the packaged build
        uses: actions/upload-artifact@v7
        with:
          name: chadvis-windows-x64-msvc
          path: ${{ env.BUILD_DIR }}/chadvis-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      # A unique key every run, so this always saves. It is the only way a
      # failing run pays for the next one.
      - name: Save the vcpkg binary cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: C:\vcpkg-cache
          key: vcpkg-dynamic-${{ github.run_id }}