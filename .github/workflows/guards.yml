# ===========================================================================
# guards.yml -- the fast gate that runs before the expensive one.
#
# check-workflows.py exists because GitHub rejects a workflow file that a YAML
# parser accepts: a repeated key (a duplicated `modules:` in build.yml) takes
# the required gate down while every local `yaml.safe_load` stays green. That
# has happened here once, and cost three commits on main.
#
# It was mandated in AGENTS.md, the PR template and RELEASING.md but run by no
# workflow, so it only helped someone who remembered it. This job remembers.
# It needs no Qt and no compiler, so it answers in about twenty seconds
# instead of after a twenty-five-minute build.
# ===========================================================================

name: guards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: guards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    name: workflow files GitHub will accept
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check workflow files
        run: ./scripts/check-workflows.py

      # T0330: the sanitizer-annotated test list has four consumers. A drift
      # between them is exactly how a race escapes measurement: an entry left
      # out of the TSAN_OPTIONS block exits 0 with no report and looks clean.
      - name: Check sanitizer test population
        run: ./scripts/check-safe-tests.py

      # T0329: a cross-thread handoff must carry no reference to a caller-owned
      # object. The rule lives in docs/dev/INVARIANTS.md; this is the gate that
      # makes it more than prose.
      - name: Check cross-thread handoffs
        run: |
          ./scripts/check-thread-handoffs.py --self-test
          ./scripts/check-thread-handoffs.py

      # T0394: SunoEndpoints has a large, known dead-constant set (T0346).
      # Pin the count so a NEW unused route (or one newly wired without
      # refreshing the baseline) is caught, without gating on old debt.
      - name: Check endpoint constants for drift
        run: ./scripts/check-endpoints.py --baseline 97

      # T0438: Release builds define QT_NO_DEBUG, so a Q_ASSERT in a test stops
      # doing its work as well as its checking. A fixture write guarded that way
      # broke four Windows chain tests with no message.
      - name: Check tests for Q_ASSERT
        run: ./scripts/check-test-asserts.py

      # T0444: integration_tests is deliberately outside the --tests build
      # list, so it can go stale silently (T0171's new GL slot landed in a
      # binary that was never rebuilt). Locally this compares binary vs
      # source mtimes; in CI there is no build dir yet, so it passes.
      - name: Check integration binary freshness
        run: ./scripts/check-integration-fresh.py
