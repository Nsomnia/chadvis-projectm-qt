[audio]
buffer_size = 2048
device = 'default'
sample_rate = 44100

[general]
debug = false

[keyboard]
next_preset = 'Right'
next_track = 'N'
play_pause = 'Space'
prev_preset = 'Left'
prev_track = 'P'
toggle_fullscreen = 'F'
toggle_record = 'R'

# T0210: no [[overlay.elements]] here -- a generated config has zero, so the
# template matches it. Add your own elements below to discover the format.
[overlay]
enabled = true

[recording]
auto_record = false
container = 'mp4'
default_filename = 'chadvis-projectm-qt_{date}_{time}'
enabled = true
record_entire_song = false
restart_track_on_record = false
stop_at_track_end = false
# T0210: omitted -- the parser default (<dataDir>/recordings) applies.
# output_directory = '~/Videos/ChadVis'

    [recording.audio]
    bitrate = 320
    channels = 2
    codec = 'aac'
    sample_rate = 48000

    [recording.video]
    b_frames = 0
    codec = 'libx264'
    crf = 18
    fps = 60
    gop_size = 0
    height = 1080
    pixel_format = 'yuv420p'
    preset = 'medium'
    width = 1920

[karaoke]
active_color = '#FFFF00FF'
bold = true
enabled = true
font_family = 'Arial'
font_size = 32
inactive_color = '#FFFFFFFF'
shadow_color = '#000000FF'
y_position = 0.5

[ui]
accent_color = '#00FF88FF'
drawer_open = false
expanded_panel = 'playback'
show_debug_panel = false
show_playlist = true
show_presets = true
sidebar_width = 280
theme = 'material'
visualizer_background = '#000000FF'

[visualizer]
aspect_correction = true
beat_sensitivity = 1.0
force_preset = ''
fps = 60
hard_cut_sensitivity = 1.0
height = 1080
mesh_x = 32
mesh_y = 24
preset_duration = 30
preset_path = ''
shuffle_presets = true
smooth_preset_duration = 5
texture_paths = []
use_default_preset = false
width = 1920

[suno]
auto_download = false
debug_lyrics = false
debug_lyrics_file = ''
device_id = ''
download_format = 'mp3'
download_path = ''
embed_metadata = true
save_lyrics = true
