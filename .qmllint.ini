# qmllint configuration for ChadVis.
#
# Without this file, `qmllint src/qml/**` prints 200+ warnings and a reader has
# no way to tell a latent bug from a style preference -- which is exactly why
# nobody ran it and why the QML kept its own bugs in the dark. This file turns
# a wall of text into a short list of things that are wrong.
#
# Run it with:
#   ./scripts/lint-qml.sh
#
# or, to see what CI sees:
#   ./build.sh --fast --tests && ninja -C build-fast all_qmllint
#
# Severity levels are: disable, warning, error (fatal). `disable` is used where
# the check is actively wrong for this tree; `error` where the check is right and
# the tree is expected to comply.
#
# NOTE: a check set to `error` here makes `all_qmllint` fail the build. If you
# turn one on, fix the findings in the same commit.

[General]
# Stop on the first error per file. A cascade of errors derived from one bad
# line is noise; the first one is the cause.
DoNotAbortOnErrors=false
# Show the source line in the output. Without it the path:line:col is all you
# get, and diagnosing means re-reading the file.
ShowSourceLine=true

# ── Enabled as errors: the tree must comply today ──────────────────────────

[Warnings]

# Unused imports are dead weight and mislead a reader into thinking a
# component is available here when it is not. Cheap to keep clean.
UnusedImports=error

# A child item missing an id that is referenced by a sibling is a real bug.
# So is a group-property/missing-property typo, which is how
# "settingsWindowApi.open is not a function" shipped (T0001).
MissingType=error
# A property that is written but never read is usually a half-finished edit.
UnqualifiedAccess=warning

# Type mismatches are the highest-value check: they catch a `color` bound to a
# `string` field, which is how T0047's appearance panel wrote "undefined"-adjacent
# text instead of a colour hex, and how `SettingsBridge.accentColor` came back
# as "" and took the whole theme down to the QML default.
IncompatibleType=error

# ── Disabled: wrong for this tree ─────────────────────────────────────────

# The app is not localised. A translation-function check on unlocalised strings
# adds 100+ false positives and no value.
TranslationFunctionMismatch=disable

# The QML compiler warnings require a full AOT pass over a module that uses
# qmldir-less relative imports (see the QTP0004 note in TargetSetup.cmake).
# These are configured here for the day that lands, not enabled now.
CompilerWarnings=warning
# QTP0004 wants qmldir per directory; the tree deliberately does not generate
# them because relative sibling imports break under it (TargetSetup.cmake:129).
# Recorded as the known trade, not a defect to fix by flipping this.
# QTBUG-117581 removed the .qml -> .qmltypes path; this check is a no-op here.
QmlImportVisitor=warning
